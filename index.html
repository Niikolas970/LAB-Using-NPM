<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ApiNasa</title>
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
 <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-stars"></i>
                Explorador APOD
            </a>
            <span class="navbar-text text-light-emphasis">
                <i class="bi bi-nasa"></i> NASA
            </span>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container mt-4">
        <div class="row">
            <!-- Columna Izquierda - APOD Principal -->
            <div class="col-lg-8">
                <!-- Selector de Fecha -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-calendar-event"></i> Buscar APOD
                        </h5>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="datePicker" class="form-label">Selecciona una fecha:</label>
                                <input type="date" id="datePicker" class="form-control" />
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button id="loadDateBtn" class="btn btn-primary w-100">
                                    <i class="bi bi-search"></i> Cargar
                                </button>
                            </div>
                        </div>
                        <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;"></div>
                    </div>
                </div>

                <!-- Card del APOD -->
                <div class="card mb-4">
                    <div class="card-body">
                        <!-- Spinner de carga -->
                        <div id="loadingSpinner" class="text-center my-5 loading-spinner">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-2">Cargando APOD...</p>
                        </div>

                        <!-- Contenido del APOD -->
                        <div id="apodContent" style="display: none;">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h2 id="apodTitle" class="mb-0">Título</h2>
                                <button id="favoriteToggleBtn" class="btn btn-outline-warning favorite-btn">
                                    <i class="bi bi-heart"></i> Favorito
                                </button>
                            </div>
                            <p id="apodDate" class="text-muted">
                                <i class="bi bi-calendar"></i> Fecha
                            </p>

                            <!-- Contenedor de Imagen/Video -->
                            <div id="mediaContainer" class="text-center mb-3">
                                <img id="apodImage" class="apod-image" src="" alt="APOD Image" style="display: none;" />
                                <div id="videoContainer" style="display: none;">
                                    <iframe id="apodVideo" class="apod-video" src="" frameborder="0" allowfullscreen></iframe>
                                </div>
                            </div>

                            <!-- Explicación -->
                            <div class="mt-3">
                                <h5>
                                    <i class="bi bi-info-circle"></i> Explicación
                                </h5>
                                <div id="apodExplanation" class="explanation-text">
                                    Cargando explicación...
                                </div>
                            </div>

                            <!-- Copyright -->
                            <p id="apodCopyright" class="text-muted mt-3" style="font-size: 0.9rem;">
                                <i class="bi bi-c-circle"></i>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha - Favoritos -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header bg-warning bg-opacity-10">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-heart-fill text-warning"></i> Mis Favoritos
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="favoritesList">
                            <p class="text-muted text-center">
                                <i class="bi bi-heart"></i> No tienes favoritos guardados
                            </p>
                        </div>
                        <div id="noFavoritesMessage" style="display: none;">
                            <p class="text-muted text-center">
                                <i class="bi bi-heart"></i> No tienes favoritos guardados
                            </p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button id="clearFavoritesBtn" class="btn btn-outline-danger btn-sm w-100">
                            <i class="bi bi-trash"></i> Limpiar Favoritos
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <footer class="footer mt-5 py-3">
        <div class="container text-center">
            <span class="text-muted">
                <i class="bi bi-nasa"></i> Datos proporcionados por la API de la NASA
            </span>
            <span class="text-muted ms-3">
                <i class="bi bi-github"></i> Proyecto APOD Explorer
            </span>
        </div>
    </footer>




    <script src="app.js"></script>
</body>
</html>
